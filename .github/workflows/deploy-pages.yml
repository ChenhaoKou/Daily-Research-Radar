name: Deploy GitHub Pages

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "sync mode (incremental: only fetch the last few days; full: re-fetch the whole retention window)"
        type: choice
        default: full
        options:
          - incremental
          - full
  schedule:
    # 每周日 00:00 北京时间（UTC+8）= 每周六 16:00 UTC。
    - cron: "0 16 * * 6"
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Belt-and-suspenders: if some action's floating major tag hasn't been moved
# to a Node-24 patch yet, force the runner to execute it on Node 24 anyway.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages base path
        id: pages
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          if [ "$REPO_NAME" = "${OWNER_LC}.github.io" ]; then
            BASE_PATH=""
            SITE_URL="https://${OWNER_LC}.github.io"
          else
            BASE_PATH="/$REPO_NAME"
            SITE_URL="https://${OWNER_LC}.github.io/${REPO_NAME}"
          fi
          echo "NEXT_PUBLIC_BASE_PATH=$BASE_PATH" >> "$GITHUB_ENV"
          echo "site_url=$SITE_URL" >> "$GITHUB_OUTPUT"

      - name: Determine sync mode
        id: mode
        run: |
          case "${{ github.event_name }}" in
            schedule)            MODE=incremental ;;
            workflow_dispatch)   MODE="${{ inputs.mode }}" ;;
            *)                   MODE=full ;;
          esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "[paper-tracker] sync mode: $MODE"

      - name: Restore previous papers.json
        if: steps.mode.outputs.mode == 'incremental'
        continue-on-error: true
        run: |
          mkdir -p public/data
          URL="${{ steps.pages.outputs.site_url }}/data/papers.json"
          echo "[paper-tracker] restoring from $URL"
          if curl -fsSL --retry 3 --retry-delay 2 "$URL" -o public/data/papers.json; then
            BYTES=$(wc -c < public/data/papers.json)
            COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('public/data/papers.json','utf8')).papers.length)")
            echo "[paper-tracker] restored $BYTES bytes / $COUNT papers"
          else
            echo "[paper-tracker] no previous papers.json found; will fall back to full fetch"
            rm -f public/data/papers.json
          fi

      - name: Generate static paper data
        run: npm run generate:data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IEEE_API_KEY: ${{ secrets.IEEE_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          SYNC_MODE: ${{ steps.mode.outputs.mode }}
          SYNC_DAYS_BACK: "1095"
          SYNC_INCREMENTAL_DAYS_BACK: "7"
          SYNC_LIMIT_PER_SOURCE: "30"
          MAX_PAPERS_PER_TOPIC: "400"
          REPOSITORY_CHECK_LIMIT: "1000"

      - name: Build static site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
